<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ATLAS 2.0 — Complete D2O & Curriculum Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #060913; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; }
    .term-pill {
      display: inline-flex; align-items: center;
      background: rgba(56, 189, 248, 0.18); border: 1px solid rgba(56, 189, 248, 0.5);
      color: #38bdf8; padding: 2px 9px; border-radius: 999px; font-weight: 600;
      cursor: pointer; font-size: 0.85em; margin: 2px 0;
    }
    .term-pill:active { background: #38bdf8; color: #060913; }
    .step-badge {
      font-size: 0.68rem; letter-spacing: 0.08em; font-weight: 800;
      padding: 4px 10px; border-radius: 6px; text-transform: uppercase; display: inline-block;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen pb-32">

  <!-- STICKY MOBILE TOP BAR -->
  <header class="sticky top-0 z-30 bg-slate-950/95 backdrop-blur border-b border-slate-800 px-4 py-3">
    <div class="flex items-center justify-between">
      <div>
        <div class="flex items-center gap-2">
          <span class="text-[10px] font-extrabold tracking-widest text-sky-400 uppercase">ATLAS 2.0 • Complete Scope</span>
          <span class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full border border-emerald-500/30">Meridian Jaipur</span>
        </div>
        <h1 class="text-base font-bold text-white mt-0.5">D2O Services & 25-Chapter Roadmap</h1>
      </div>
      <button onclick="toggleDrawer()" class="px-3 py-1.5 rounded-xl bg-slate-800 border border-slate-700 text-xs font-bold text-sky-300">
        🗺️ All 25 Chapters
      </button>
    </div>

    <!-- MAIN SCOPE NAVIGATION TABS -->
    <div class="flex gap-2 overflow-x-auto no-scrollbar mt-2.5 pb-1">
      <button onclick="switchScope('d2o')" class="scope-tab shrink-0 px-3 py-1 rounded-lg bg-emerald-500/20 text-emerald-300 text-xs font-bold border border-emerald-500/40" id="tab-d2o">1. D2O Service Portfolio</button>
      <button onclick="switchScope('lifecycle')" class="scope-tab shrink-0 px-3 py-1 rounded-lg bg-slate-800 text-slate-300 text-xs font-bold border border-slate-700" id="tab-lifecycle">2. Building Lifecycle (Ch 1-10)</button>
      <button onclick="switchScope('compliance')" class="scope-tab shrink-0 px-3 py-1 rounded-lg bg-slate-800 text-slate-300 text-xs font-bold border border-slate-700" id="tab-compliance">3. Statutory & Compliance</button>
      <button onclick="switchScope('simulations')" class="scope-tab shrink-0 px-3 py-1 rounded-lg bg-slate-800 text-slate-300 text-xs font-bold border border-slate-700" id="tab-simulations">4. Simulations & Audits</button>
    </div>
  </header>

  <!-- SLIDE-OVER ALL-CHAPTERS & SCOPE DRAWER -->
  <div id="masterDrawer" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/80" onclick="toggleDrawer()"></div>
    <div class="relative w-4/5 max-w-sm bg-slate-900 h-full border-r border-slate-800 flex flex-col">
      <div class="p-4 border-b border-slate-800 flex justify-between items-center">
        <div>
          <div class="text-xs font-bold text-sky-400">ATLAS 2.0 MASTER CURRICULUM</div>
          <div class="text-[11px] text-slate-400">Complete 25-Chapter Roadmap</div>
        </div>
        <button onclick="toggleDrawer()" class="text-slate-400 text-lg font-bold px-2">✕</button>
      </div>
      <div id="chapterList" class="flex-1 overflow-y-auto p-3 space-y-1.5 text-xs"></div>
    </div>
  </div>

  <!-- DYNAMIC CONTENT CONTAINER -->
  <main id="mainContent" class="px-4 py-5 space-y-6 max-w-xl mx-auto"></main>

  <!-- DETAILED BOTTOM SHEET POPUP FOR TAPPED TERMS -->
  <div id="termSheet" class="fixed inset-x-0 bottom-0 z-40 bg-slate-900 border-t-2 border-sky-500 rounded-t-3xl p-5 shadow-2xl transform translate-y-full transition-transform duration-300 max-h-[85vh] overflow-y-auto">
    <div class="flex items-start justify-between mb-3 sticky top-0 bg-slate-900 pb-2 border-b border-slate-800">
      <div>
        <span id="termBadge" class="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-sky-500/20 text-sky-300">D2O Service / Concept</span>
        <h3 id="termName" class="text-lg font-bold text-white mt-1">Term Title</h3>
      </div>
      <button onclick="closeTerm()" class="bg-slate-800 text-slate-300 rounded-full w-8 h-8 font-bold flex items-center justify-center">✕</button>
    </div>
    <div class="space-y-3 text-xs pb-6">
      <div>
        <div class="text-[10px] text-sky-400 font-bold uppercase tracking-wider mb-1">Simple Hinglish & Technical Explanation:</div>
        <p id="termHinglish" class="text-slate-100 text-sm leading-relaxed"></p>
      </div>
      <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 space-y-1">
        <div class="text-[10px] text-amber-400 font-bold uppercase tracking-wider">Consultancy Workflow & Deliverables:</div>
        <p id="termWorkflow" class="text-slate-300 leading-relaxed"></p>
      </div>
      <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 space-y-1">
        <div class="text-[10px] text-emerald-400 font-bold uppercase tracking-wider">Design2Occupancy (D2O) Status:</div>
        <p id="termClassification" class="text-emerald-300 font-medium"></p>
      </div>
    </div>
  </div>

  <script>
    // Complete 25-Chapter Curriculum Database
    const chapters = [
      { id: 1, title: "Birth of a Building — Owner's Idea", status: "done" },
      { id: 2, title: "Land Ownership, Title & Zoning Rules", status: "done" },
      { id: 3, title: "Site Investigation & Soil SBC", status: "done" },
      { id: 4, title: "Development Potential, FAR/FSI & Setbacks", status: "done" },
      { id: 5, title: "Project Feasibility, CAPEX, OPEX & IRR", status: "done" },
      { id: 6, title: "Project Brief, OPR & BOD", status: "done" },
      { id: 7, title: "Design Team & Consultant Coordination", status: "done" },
      { id: 8, title: "Concept Design & Site Massing", status: "done" },
      { id: 9, title: "Architectural Plans, Sections & Elevations", status: "done" },
      { id: 10, title: "Structural Design, Loads & Load Paths", status: "active" },
      { id: 11, title: "HVAC Systems, Chillers & Energy Modelling", status: "next" },
      { id: 12, title: "Electrical Systems, SLD & Backup Power", status: "locked" },
      { id: 13, title: "Plumbing, Water Balance & STP Treatment", status: "locked" },
      { id: 14, title: "Fire & Life Safety (FLS) & Smoke Management", status: "locked" },
      { id: 15, title: "Building Envelope, Façade & Glazing Performance", status: "locked" },
      { id: 16, title: "Statutory Approvals (EC, CTE, CTO & NOCs)", status: "locked" },
      { id: 17, title: "Green Building Certifications (LEED, IGBC, GRIHA, WELL)", status: "locked" },
      { id: 18, title: "CFD Simulations & Thermal Comfort Analysis", status: "locked" },
      { id: 19, title: "Energy & Water Audits", status: "locked" },
      { id: 20, title: "Electrical Safety & FLS Compliance Audits", status: "locked" },
      { id: 21, title: "Life Cycle Assessment (LCA) & Embodied Carbon", status: "locked" },
      { id: 22, title: "Commissioning (Cx), Testing & Balancing", status: "locked" },
      { id: 23, title: "As-Built Handover & Facility Management", status: "locked" },
      { id: 24, title: "Net-Zero Strategies, Retrofits & Optimization", status: "locked" },
      { id: 25, title: "Professional Consultancy Pitching & Client Advisory", status: "locked" }
    ];

    // Complete Scope Tracks
    const scopes = {
      "d2o": {
        html: `
          <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4">
            <span class="step-badge bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">Official D2O Scope</span>
            <h2 class="text-base font-bold text-white">Design2Occupancy Services Portfolio</h2>
            <p class="text-sm text-slate-300 leading-relaxed">
              Design2Occupancy Services LLP (Jaipur) delivers end-to-end sustainability, green building consulting, and performance audits. Explore core verified services below:
            </p>
            <div class="space-y-3 text-xs">
              <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-1">
                <div class="text-emerald-400 font-bold text-sm">1. Green Building Certification Consulting</div>
                <p class="text-slate-300">Complete documentation and advisory for <span class="term-pill" onclick="openTerm('LEED')">LEED</span>, <span class="term-pill" onclick="openTerm('IGBC')">IGBC</span>, GRIHA, EDGE, and WELL standards across commercial real estate.</p>
              </div>
              <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-1">
                <div class="text-sky-400 font-bold text-sm">2. Whole-Building Energy Modelling</div>
                <p class="text-slate-300">Advanced thermal simulations to optimize HVAC equipment sizing and demonstrate <span class="term-pill" onclick="openTerm('ECBC')">ECBC</span> compliance.</p>
              </div>
              <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-1">
                <div class="text-purple-400 font-bold text-sm">3. CFD & Daylighting Simulations</div>
                <p class="text-slate-300">Evaluating indoor airflow, pedestrian wind comfort, and daylight autonomy via <span class="term-pill" onclick="openTerm('CFD')">CFD simulation</span>.</p>
              </div>
              <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-1">
                <div class="text-amber-400 font-bold text-sm">4. Mandatory & Performance Audits</div>
                <p class="text-slate-300">Executing <span class="term-pill" onclick="openTerm('Energy Audits')">Energy Audits</span>, <span class="term-pill" onclick="openTerm('Water Audits')">Water Audits</span>, <span class="term-pill" onclick="openTerm('FLS Audits')">Fire & Life Safety Audits</span>, and <span class="term-pill" onclick="openTerm('Electrical Audits')">Electrical Safety Audits</span>.</p>
              </div>
              <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-1">
                <div class="text-pink-400 font-bold text-sm">5. LCA & Embodied Carbon Accounting</div>
                <p class="text-slate-300">Conducting <span class="term-pill" onclick="openTerm('LCA')">Life Cycle Assessment</span> to evaluate <span class="term-pill" onclick="openTerm('Embodied Carbon')">Embodied Carbon</span> in structural materials.</p>
              </div>
            </div>
          </section>
        `
      },
      "lifecycle": {
        html: `
          <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4">
            <span class="step-badge bg-sky-500/20 text-sky-300 border border-sky-500/30">Chapters 1 to 10 Recap</span>
            <h2 class="text-base font-bold text-white">Meridian Developments — Structural Stage</h2>
            <p class="text-sm text-slate-300 leading-relaxed">
              Our 2-acre, G+8 commercial office project in Jaipur has crossed site surveys, architectural massing, and is currently at <span class="term-pill" onclick="openTerm('Structural Design')">Structural Design</span> (Chapter 10).
            </p>
            <div class="space-y-3 text-xs">
              <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-1">
                <div class="text-sky-400 font-bold text-sm">Load Path Principle</div>
                <p class="text-slate-300">Loads transfer from <span class="term-pill" onclick="openTerm('Beam')">Beams</span> and <span class="term-pill" onclick="openTerm('Column')">Columns</span> down to the <span class="term-pill" onclick="openTerm('Foundation')">Foundation</span> and soil bearing capacity (<span class="term-pill" onclick="openTerm('SBC')">SBC</span>).</p>
              </div>
            </div>
          </section>
        `
      },
      "compliance": {
        html: `
          <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4">
            <span class="step-badge bg-amber-500/20 text-amber-300 border border-amber-500/30">Statutory Track (Ch 16)</span>
            <h2 class="text-base font-bold text-white">Clearances, Board Consents & Building Permits</h2>
            <p class="text-sm text-slate-300 leading-relaxed">
              Managing regulatory obligations before construction and commercial operations begin.
            </p>
            <div class="space-y-3 text-xs">
              <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-1">
                <div class="text-amber-400 font-bold text-sm">EC, CTE & CTO Workflow</div>
                <p class="text-slate-300"><span class="term-pill" onclick="openTerm('EC')">Environmental Clearance</span> for large built-up areas, <span class="term-pill" onclick="openTerm('CTE')">Consent to Establish</span> prior to construction, and <span class="term-pill" onclick="openTerm('CTO')">Consent to Operate</span> before employee occupancy.</p>
              </div>
            </div>
          </section>
        `
      },
      "simulations": {
        html: `
          <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4">
            <span class="step-badge bg-purple-500/20 text-purple-300 border border-purple-500/30">Simulations & Audits (Ch 18-22)</span>
            <h2 class="text-base font-bold text-white">Engineering Simulations & Performance Testing</h2>
            <p class="text-sm text-slate-300 leading-relaxed">
              Verifying design efficiency and building physics through advanced software and field diagnostics.
            </p>
            <div class="space-y-3 text-xs">
              <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-1">
                <div class="text-purple-400 font-bold text-sm">Commissioning & Testing</div>
                <p class="text-slate-300"><span class="term-pill" onclick="openTerm('Commissioning')">Commissioning (Cx)</span> ensures MEPF systems operate at peak design efficiency, backed by rigorous safety audits.</p>
              </div>
            </div>
          </section>
        `
      }
    };

    // Detailed Terms Database
    const terms = {
      "LEED": {
        badge: "D2O Core Service • Green Certification",
        hinglish: "Leadership in Energy and Environmental Design — USGBC ka global green building rating system.",
        workflow: "Registration, credit documentation, energy modelling, and final certification review.",
        classification: "Verified D2O Core Offering"
      },
      "IGBC": {
        badge: "D2O Core Service • Indian Rating",
        hinglish: "Indian Green Building Council rating system tailored for Indian climatic conditions.",
        workflow: "Documentation across mandatory and optional green credits.",
        classification: "Verified D2O Core Offering"
      },
      "ECBC": {
        badge: "D2O Core Service • Energy Compliance",
        hinglish: "Energy Conservation Building Code — Commercial buildings ke liye mandatory energy standard.",
        workflow: "Evaluated via architectural drawing review and compliance software simulation.",
        classification: "Verified D2O Core Offering"
      },
      "CFD": {
        badge: "D2O Core Service • Advanced Simulation",
        hinglish: "Computational Fluid Dynamics — Computer par hawa ke bahav ki physics test karna.",
        workflow: "Generates 3D velocity and pressure contours to optimize natural ventilation.",
        classification: "Verified D2O Core Offering"
      },
      "Energy Audits": {
        badge: "D2O Core Service • Operational Audit",
        hinglish: "Building ki bijli khapat ko measure karke waste identify karna.",
        workflow: "Portable power meters and thermal loggers deployed on site.",
        classification: "Verified D2O Core Offering"
      },
      "Water Audits": {
        badge: "D2O Core Service • Sustainability Audit",
        hinglish: "Building mein paani kahan use ho raha hai aur kahan waste ho raha hai iska audit.",
        workflow: "Water meter logging and fixture flow-rate testing.",
        classification: "Verified D2O Core Offering"
      },
      "FLS Audits": {
        badge: "D2O Core Service • Safety Audit",
        hinglish: "Fire & Life Safety Audit — Fire alarms, sprinklers, aur exit staircases ki safety check karna.",
        workflow: "Physical inspection against NBC guidelines.",
        classification: "Verified D2O Core Offering"
      },
      "Electrical Audits": {
        badge: "D2O Core Service • Safety Audit",
        hinglish: "Electrical Safety Audit — Transformers, panels, aur earthing ki safety check karna.",
        workflow: "Thermographic scanning and earth pit resistance testing.",
        classification: "Verified D2O Core Offering"
      },
      "LCA": {
        badge: "D2O Core Service • Carbon Accounting",
        hinglish: "Life Cycle Assessment — Building banane se todne tak total carbon footprint calculate karna.",
        workflow: "Inventorying material quantities using LCA software.",
        classification: "Verified D2O Core Offering"
      },
      "Embodied Carbon": {
        badge: "D2O Concept • Decarbonization",
        hinglish: "Concrete aur steel banane mein jo carbon release hota hai.",
        workflow: "Calculated via structural BOQ and emission factors.",
        classification: "Verified D2O Core Offering"
      },
      "EC": {
        badge: "Statutory Clearance",
        hinglish: "Environmental Clearance — MoEFCC ya SEIAA dwara bade projects ko diya jane wala approval.",
        workflow: "Form-1 submission and EIA study for built-up areas >20,000 sq.m.",
        classification: "Statutory / Authorized Partner"
      },
      "CTE": {
        badge: "Statutory Consent",
        hinglish: "Consent to Establish — State Pollution Control Board se construction se pehle ki anugya.",
        workflow: "Submitted prior to breaking ground with STP design.",
        classification: "Technical Documentation Support"
      },
      "CTO": {
        badge: "Statutory Licence",
        hinglish: "Consent to Operate — Building complete hone par pollution board se liya jane wala licence.",
        workflow: "Issued after physical inspection of STP and DG stack emissions.",
        classification: "Technical Filing & Audit Support"
      },
      "Structural Design": {
        badge: "Engineering Stage (Ch 10)",
        hinglish: "Building ki haddiyan (Slab, Beam, Column, Foundation) design karna.",
        workflow: "ETABS analysis and GFC structural drawings.",
        classification: "Structural Consultant Scope"
      },
      "Beam": { badge: "Structure", hinglish: "Horizontal concrete member jo slab ka wajan columns tak le jata hai.", workflow: "Collects slab loads.", classification: "Structural Scope" },
      "Column": { badge: "Structure", hinglish: "Vertical pillar jo wajan foundation tak press karta hai.", workflow: "Transfers axial loads.", classification: "Structural Scope" },
      "Foundation": { badge: "Structure", hinglish: "Zameen ke neeche ka hissa jo wajan mitti mein phailata hai.", workflow: "Spreads load based on SBC.", classification: "Structural Scope" },
      "SBC": { badge: "Geotech", hinglish: "Safe Bearing Capacity — mitti ki wajan jhelne ki taakat.", workflow: "Soil testing report.", classification: "Geotechnical Scope" },
      "Commissioning": { badge: "QA/QC", hinglish: "Chillers aur AHUs ko test karke verify karna ki woh design ke hissaab se chal rahe hain.", workflow: "Pre-handover functional testing.", classification: "Verified D2O / Cx Partner" }
    };

    function renderChaptersList() {
      document.getElementById('chapterList').innerHTML = chapters.map(ch => {
        const icon = ch.status === 'done' ? '✅' : ch.status === 'active' ? '🔵' : '🔒';
        const style = ch.status === 'active' ? 'bg-sky-500/20 border border-sky-500/40 text-white font-bold' : 'text-slate-400';
        return `<div class="px-3 py-2 rounded-xl flex justify-between items-center ${style}">
          <span class="truncate">${ch.id}. ${ch.title}</span><span>${icon}</span>
        </div>`;
      }).join('');
    }

    function switchScope(key) {
      document.querySelectorAll('.scope-tab').forEach(btn => {
        btn.className = "scope-tab shrink-0 px-3 py-1 rounded-lg bg-slate-800 text-slate-300 text-xs font-bold border border-slate-700";
      });
      document.getElementById(`tab-${key}`).className = "scope-tab shrink-0 px-3 py-1 rounded-lg bg-emerald-500/20 text-emerald-300 text-xs font-bold border border-emerald-500/40";
      document.getElementById('mainContent').innerHTML = scopes[key].html;
    }

    function toggleDrawer() {
      document.getElementById('masterDrawer').classList.toggle('hidden');
    }

    function openTerm(key) {
      const item = terms[key];
      if (!item) return;
      document.getElementById('termName').textContent = key;
      document.getElementById('termBadge').textContent = item.badge;
      document.getElementById('termHinglish').textContent = item.hinglish;
      document.getElementById('termWorkflow').textContent = item.workflow;
      document.getElementById('termClassification').textContent = item.classification;
      document.getElementById('termSheet').classList.remove('translate-y-full');
    }

    function closeTerm() {
      document.getElementById('termSheet').classList.add('translate-y-full');
    }

    renderChaptersList();
    switchScope('d2o');
  </script>
</body>
</html>
